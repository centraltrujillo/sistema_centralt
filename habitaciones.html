<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones | Hotel Central</title>
    <link rel="icon" type="image/png" href="img/logo.png" />
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700&family=Lato:wght=300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/habitaciones.css"> 
</head>
<body>

    <main class="main-content">
        <header class="header-flex">
            <div class="header-left">
                <a href="dashboard.html" class="btn-back" title="Volver al Dashboard">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="title-container">
                    <h2 class="main-title">Habitaciones HOTEL CENTRAL</h2>
                    <p id="current-date" class="date-text"></p>
                </div>
            </div>

            <nav class="header-actions">
                <a href="reservas.html" class="btn-header">
                    <i class="fa-solid fa-calendar-check"></i>
                    <span>Ver Reservas</span>
                </a>
                <a href="rack.html" class="btn-header">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Ver Ocupabilidad</span>
                </a>
            </nav>
        </header>

        <section class="hab-stats">
            <div class="stat-item">
                <label>Libres</label> 
                <span id="stat-libres">--</span> 
            </div>
            <div class="stat-item">
                <label>Ocupadas</label>
                <span id="stat-ocupadas">--</span>
            </div>
            <div class="stat-item">
                <label>En Limpieza</label>
                <span id="stat-limpieza">--</span>
            </div>
        </section>

        <section class="hab-grid" id="habGrid">
            </section>
    </main>

<div id="modalReserva" class="modal-reserva-overlay">
    <div class="modal-reserva-content">
        
        <div class="modal-reserva-header">
            <h3 id="modalTitle">Nueva Reserva</h3>
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
        </div>

        <form id="formNuevaReserva" style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
            
            <div style="flex-grow: 1; overflow-y: auto; padding-right: 5px;">
                
                <div class="form-section-title">DATOS DEL HUÉSPED</div>
                <div class="form-grid-compact">
                    <input type="hidden" id="resHuespedId">

                    <div class="form-group span-2">
                        <label>Nombres y Apellidos</label>
                        <input type="text" id="resHuesped" required placeholder="Nombre completo">
                        <datalist id="listaHuespedesSugeridos"></datalist>
                    </div>
                    
                    <div class="form-group">
                        <label>Tipo Doc.</label>
                        <select id="resTipoDoc">
                            <option value="DNI">DNI</option>
                            <option value="Pasaporte">Pasaporte</option>
                            <option value="CE">C.E.</option>
                            <option value="RUC">RUC</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Nro. Documento</label>
                        <input type="text" id="resDoc">
                    </div>
                    
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="resTelefono">
                    </div>
                    
                    <div class="form-group">
                        <label>Nacionalidad</label>
                        <input type="text" id="resNacionalidad" value="Peruana">
                    </div>
                    
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="resCiudad" placeholder="Ciudad de residencia">
                    </div>
                    
                    <div class="form-group">
                        <label>Nacimiento</label>
                        <input type="date" id="resNacimiento">
                    </div>
                    
                    <div class="form-group span-2">
                        <label>Correo Electrónico</label>
                        <input type="email" id="resCorreo" placeholder="correo@ejemplo.com">
                    </div>
                    
                    <div class="form-group span-2">
                        <label>Preferencias</label>
                        <input type="text" id="resPreferencia" placeholder="habitación favorita, allergies, etc.">
                    </div>
                </div>

                <div class="form-section-title">DETALLES DE LA ESTANCIA</div>
                <div class="form-grid-compact">
                    <div class="form-group">
                        <label>Habitación</label>
                        <select id="resHabitacion" required></select>
                    </div>
                    
                    <div class="form-group">
                        <label>Check In</label>
                        <input type="date" id="resCheckIn" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Check Out</label>
                        <input type="date" id="resCheckOut" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Medio Reserva</label>
                        <select id="resMedio" required>
                            <option value="">Seleccionar...</option>
                            <option value="Presencial">Presencial (Personal)</option>
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="Teléfono">Teléfono / Llamada</option>
                            <option value="Booking">Booking</option>
                            <option value="Airbnb">Airbnb</option>
                            <option value="Expedia">Expedia</option>
                            <option value="Gmail">Gmail</option>
                            <option value="Day use">Day use</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div id="statusDisponibilidad" class="status-badge span-4"></div>

                    <div class="form-group">
                        <label>N° Personas</label>
                        <input type="number" id="resNumPersonas" min="1" value="1">
                    </div>
                    
                    <div class="form-group">
                        <label>Desayuno</label>
                        <select id="resInfo">
                            <option value="true">CON DESAYUNO</option>
                            <option value="false">SIN DESAYUNO</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Hora Ingreso</label>
                        <input type="time" id="resEarlyHora">
                    </div>
                    
                    <div class="form-group">
                        <label>Hora Salida</label>
                        <input type="time" id="resLateHora">
                    </div>

                    <div class="form-group">
                        <label>Cochera</label>
                        <select id="resCochera">
                            <option value="No">No requiere</option>
                            <option value="Red Parking">Red Parking</option>
                            <option value="Santa Mónica">Santa Mónica</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px;">
                        <label for="resAplicaEarly" style="margin: 0; cursor: pointer; font-weight: bold; font-size: 12px;">¿Aplica Early Check-In?</label>
                        <input type="checkbox" id="resAplicaEarly" style="width: 20px; height: 20px; cursor: pointer;">
                    </div>
                    
                    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px;">
                        <label for="resAplicaLate" style="margin: 0; cursor: pointer; font-weight: bold; font-size: 12px;">¿Aplica Late Check-Out?</label>
                        <input type="checkbox" id="resAplicaLate" style="width: 20px; height: 20px; cursor: pointer;">
                    </div>

                    <div class="form-group">
                        <label>Estado Reserva</label>
                        <select id="resEstado" required>
                            <option value="Confirmada">Confirmada</option>
                            <option value="En Curso">En Curso (Check-In)</option>
                            <option value="Finalizada">Finalizada (Check-Out)</option>
                            <option value="Cancelada">Cancelada</option>
                            <option value="No Show">No Show</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Traslado Logístico</label>
                        <input type="text" id="resTraslado" placeholder="Detalles del vuelo o transporte">
                    </div>

                    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px;">
                        <label for="resAplicaNinos" style="margin: 0; cursor: pointer; font-weight: bold; font-size: 12px;">¿Tiene Niños?</label>
                        <input type="checkbox" id="resAplicaNinos" style="width: 20px; height: 20px; cursor: pointer;">
                    </div>
                    
                    <div class="form-group span-2">
                        <label>Información de los Niños</label>
                        <input type="text" id="resInformacionNinos" placeholder="Detalles de los niños">
                    </div>
                </div>

                <div class="form-section-title">TARIFA DE LA RESERVA</div>
                <div class="form-grid-compact highlight-section">
                    <div class="form-group">
                        <label>Tarifa por Noche</label>
                        <input type="number" id="resTarifa" step="0.01" placeholder="0.00">
                    </div>
                    
                    <div class="form-group">
                        <label>Moneda</label>
                        <select id="resMoneda">
                            <option value="PEN">Soles (S/)</option>
                            <option value="USD">Dólares ($)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>T. Cambio</label>
                        <input type="number" id="resTipoCambio" step="0.01">
                    </div>
                    
                    <div class="form-group">
                        <label>Total Estancia</label>
                        <input type="number" id="resTotal" class="input-total" step="0.01" value="0.00">
                    </div>

                    <div class="form-group">
                        <label>Adelanto (Abono)</label>
                        <input type="number" id="resAdelantoMonto" class="input-adelanto" step="0.01" value="0.00">
                    </div>
                    
                    <div class="form-group">
                        <label>Método de Pago</label>
                        <select id="resMetodoPago">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Yape">Yape</option>
                            <option value="Transferencia">Transferencia Bancaria</option>
                            <option value="Tarjeta">Tarjeta</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Monto Pendiente</label>
                        <input type="number" id="resDiferencia" class="input-diferencia" step="0.01" readonly value="0.00">
                    </div>
                    
                    <div class="form-group">
                        <label>Detalle del Adelanto</label>
                        <input type="text" id="resAdelantoDetalle" placeholder="Nro de operación o transferencia">
                    </div>
                </div>

                <div class="form-grid-compact" style="margin-top: 10px;">
                    <div class="form-group span-4">
                        <label>Observaciones</label>
                        <input type="text" id="resObservaciones" placeholder="Comentarios adicionales sobre la reserva">
                    </div>
                </div>
            </div>

            <div class="form-actions-res">
                <button type="submit" class="btn-save">Ingresar a la Habitación</button>
            </div>
            
        </form>
    </div>
</div>

    <script src="js/config.js" type="module"></script>
    <script type="module" src="js/auth-check.js"></script>
    <script type="module" src="js/habitaciones.js"></script>
    <script>
        // Setear fecha de hoy en el encabezado de forma limpia
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });
    </script>
</body>
</html>
